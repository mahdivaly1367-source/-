name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Type-check, navigation tests, production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Test navigation geometry
        run: npm run test:navigation
      - name: Test browser interactions
        run: npm run test:e2e
      - name: Type-check project
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Upload Phase 1 visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-browser-captures
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
