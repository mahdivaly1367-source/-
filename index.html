  <head>
    <script>
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            }
          });
        } catch (e) {
          console.warn('[Shim] Failed to make window.fetch writable:', e);
        }
      })();
    </script>
